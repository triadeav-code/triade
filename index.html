<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tríade — Soluções & Engenharia Audiovisual</title>
  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .line-clamp-2 {
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
  </style>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen flex flex-col justify-between font-sans">

  <!-- Header / Navbar -->
  <header class="bg-gray-800 border-b border-gray-700 sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 py-4 flex flex-col md:flex-row items-center justify-between gap-4">
      <div class="flex items-center gap-3">
        <div class="bg-blue-600 text-white font-black text-xl px-3 py-1 rounded-lg">TRÍADE</div>
        <span class="text-sm font-medium text-gray-400 border-l border-gray-600 pl-3">Engenharia ProAV & Projetos</span>
      </div>

      <!-- Barra de Busca -->
      <form id="search-form" class="w-full md:w-1/2 flex gap-2">
        <input 
          type="text" 
          id="search-input" 
          placeholder="Ex: Projetor Epson, Câmera PTZ NDI..." 
          class="w-full bg-gray-900 border border-gray-700 text-white px-4 py-2 rounded-lg focus:outline-none focus:border-blue-500 text-sm"
          required
        >
        <button 
          type="submit" 
          class="bg-blue-600 hover:bg-blue-700 text-white px-5 py-2 rounded-lg font-semibold text-sm transition"
        >
          Buscar
        </button>
      </form>
    </div>
  </header>

  <!-- Conteúdo Principal -->
  <main class="max-w-7xl mx-auto px-4 py-8 w-full flex-grow">
    
    <!-- Seção de Atalhos / Categorias -->
    <section class="mb-8">
      <h2 class="text-xs font-semibold uppercase tracking-wider text-gray-400 mb-3">Categorias Recomendadas</h2>
      <div class="flex flex-wrap gap-2">
        <button onclick="buscar('camera ptz')" class="bg-gray-800 hover:bg-gray-700 text-gray-300 text-xs px-3 py-2 rounded-lg border border-gray-700 transition">
          📹 Câmeras PTZ
        </button>
        <button onclick="buscar('projetor epson')" class="bg-gray-800 hover:bg-gray-700 text-gray-300 text-xs px-3 py-2 rounded-lg border border-gray-700 transition">
          📽️ Projeção Laser
        </button>
        <button onclick="buscar('iluminador led dmx')" class="bg-gray-800 hover:bg-gray-700 text-gray-300 text-xs px-3 py-2 rounded-lg border border-gray-700 transition">
          💡 Iluminação DMX
        </button>
        <button onclick="buscar('mesa de som yamaha')" class="bg-gray-800 hover:bg-gray-700 text-gray-300 text-xs px-3 py-2 rounded-lg border border-gray-700 transition">
          🎛️ Áudio & Mesas
        </button>
      </div>
    </section>

    <!-- Indicador de Pesquisa -->
    <div class="flex justify-between items-center mb-6">
      <h1 id="search-title" class="text-xl font-bold text-white">Catálogo de Equipamentos ProAV</h1>
      <span id="results-count" class="text-xs text-gray-400"></span>
    </div>

    <!-- Grid de Produtos -->
    <div id="catalog-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
      <!-- Os cartões de produtos serão injetados via JavaScript -->
    </div>

  </main>

  <!-- Rodapé -->
  <footer class="bg-gray-800 border-t border-gray-700 py-6 text-center text-xs text-gray-500">
    <p>© Tríade — Engenharia e Consultoria Audiovisual. Links integrados via rede de afiliados oficial.</p>
  </footer>

  <!-- Script de Automação & Busca Dinâmica -->
  <script>
    // Configurações Oficiais de Afiliado (Tríade)
    const MATT_TOOL = "91496197";
    const MATT_WORD = "triadeshop";

    // Converte permalink normal da API para o seu Link de Afiliado Monetizado
    function gerarLinkAfiliado(permalink) {
      if (!permalink) return "#";
      const urlBase = permalink.split('?')[0];
      return `${urlBase}?matt_tool=${MATT_TOOL}&matt_word=${MATT_WORD}&forceInApp=true`;
    }

    // Função de Busca com Proxy Anti-CORS
    async function buscar(termo) {
      const input = document.getElementById('search-input');
      const grid = document.getElementById('catalog-grid');
      const title = document.getElementById('search-title');
      const count = document.getElementById('results-count');

      input.value = termo;
      title.innerText = `Resultados para: "${termo}"`;
      grid.innerHTML = '<div class="col-span-full py-12 text-center text-gray-400">Consultando catálogo em tempo real...</div>';

      try {
        // Endpoint original do Mercado Livre
        const targetUrl = `https://api.mercadolibre.com/sites/MLB/search?q=${encodeURIComponent(termo)}`;
        
        // Proxy AllOrigins para ignorar bloqueio de CORS no GitHub Pages
        const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(targetUrl)}`;

        const response = await fetch(proxyUrl);
        
        if (!response.ok) {
          throw new Error(`Erro na conexão com o proxy: ${response.status}`);
        }

        const wrapperData = await response.json();
        const data = JSON.parse(wrapperData.contents); // Conteúdo real retornado pelo Mercado Livre

        grid.innerHTML = '';

        if (!data.results || data.results.length === 0) {
          grid.innerHTML = `
            <div class="col-span-full py-12 text-center text-gray-400">
              <p class="text-base mb-2">Nenhum equipamento encontrado para "${termo}".</p>
              <p class="text-xs text-gray-500">Tente termos como "projetor epson", "camera ptz" ou "mesa de som".</p>
            </div>`;
          count.innerText = '0 produtos';
          return;
        }

        const produtosExibidos = data.results.slice(0, 12);
        count.innerText = `${produtosExibidos.length} produtos exibidos`;

        produtosExibidos.forEach(produto => {
          const linkMonetizado = gerarLinkAfiliado(produto.permalink);
          const imagemHD = produto.thumbnail ? produto.thumbnail.replace('-I.jpg', '-O.jpg').replace('http://', 'https://') : '';
          const precoFormatado = produto.price ? produto.price.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' }) : 'Consulte';

          grid.innerHTML += `
            <div class="bg-gray-800 border border-gray-700 rounded-xl p-4 flex flex-col justify-between hover:border-blue-500 transition shadow-lg">
              <div>
                <div class="w-full h-48 bg-gray-900 rounded-lg mb-4 p-2 flex items-center justify-center overflow-hidden">
                  <img src="${imagemHD}" alt="${produto.title}" class="max-h-full max-w-full object-contain" loading="lazy">
                </div>
                <h3 class="text-sm font-semibold text-gray-200 line-clamp-2 mb-2" title="${produto.title}">${produto.title}</h3>
                <p class="text-lg font-black text-green-400 mb-4">${precoFormatado}</p>
              </div>

              <a 
                href="${linkMonetizado}" 
                target="_blank" 
                rel="noopener noreferrer" 
                class="w-full text-center bg-blue-600 hover:bg-blue-700 text-white text-xs font-bold py-2.5 rounded-lg transition block"
              >
                Ver no Mercado Livre
              </a>
            </div>
          `;
        });

      } catch (error) {
        console.error("Erro na busca via proxy:", error);
        grid.innerHTML = '<div class="col-span-full py-12 text-center text-red-400">Falha ao carregar os dados. Tente atualizar a página.</div>';
      }
    }

    // Listener do Formulário
    document.getElementById('search-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const termo = document.getElementById('search-input').value.trim();
      if (termo) buscar(termo);
    });

    // Carga inicial automatizada
    window.addEventListener('DOMContentLoaded', () => {
      buscar('projetor epson');
    });
  </script>
</body>
</html>
